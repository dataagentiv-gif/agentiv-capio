<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>{% block title %}Video Clipping Engine{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h7A1.5 1.5 0 0 1 12 3.5v13A1.5 1.5 0 0 1 10.5 18h-7A1.5 1.5 0 0 1 2 16.5v-13Z" fill="#1868db"/>
        <path d="M13.5 7.2 17.4 5a.6.6 0 0 1 .9.52v8.96a.6.6 0 0 1-.9.52l-3.9-2.2V7.2Z" fill="#101214"/>
      </svg>
      Video Clipping Engine
    </a>
    <div class="nav-links">
      <a href="/"         class="{% if page == 'submit'   %}active{% endif %}">Submit</a>
      <a href="/process"  class="{% if page == 'process'  %}active{% endif %}">Proses</a>
      <a href="/results"  class="{% if page == 'results'  %}active{% endif %}">Hasil</a>
      <a href="/settings" class="{% if page == 'settings' %}active{% endif %}">Setting</a>
    </div>
  </div>
</nav>

<main class="{% block main_class %}{% endblock %}">
  <div class="page-head">
    <h1 class="display">{% block heading %}{% endblock %}</h1>
    <p class="lede">{% block lede %}{% endblock %}</p>
  </div>
  {% block content %}{% endblock %}
</main>

<script src="/static/app.js"></script>
{% block script %}{% endblock %}
</body>
</html>
