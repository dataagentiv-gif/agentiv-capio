<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="format-detection" content="telephone=no">
  <title>Video Clipping Engine</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="/">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" aria-hidden="true">
        <path d="M2 3.5A1.5 1.5 0 0 1 3.5 2h7A1.5 1.5 0 0 1 12 3.5v13A1.5 1.5 0 0 1 10.5 18h-7A1.5 1.5 0 0 1 2 16.5v-13Z" fill="#1868db"/>
        <path d="M13.5 7.2 17.4 5a.6.6 0 0 1 .9.52v8.96a.6.6 0 0 1-.9.52l-3.9-2.2V7.2Z" fill="#101214"/>
      </svg>
      Video Clipping Engine
    </a>
    <div class="nav-links">
      <a href="/" class="active">Submit</a>
      <a href="/history">History</a>
    </div>
  </div>
</nav>

<main class="narrow">
  <div class="page-head">
    <h1 class="display">Ubah video panjang jadi klip siap posting.</h1>
    <p class="lede">
      Satu link YouTube, beberapa klip 9:16 dengan caption burned-in, judul, dan hashtag.
    </p>
  </div>

  <div class="card">
    <form id="f">
      <div class="form-row">
        <div class="field">
          <label for="url">Link YouTube</label>
          <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." required>
        </div>
        <div class="field compact">
          <label for="n">Jumlah klip</label>
          <input type="number" id="n" value="{{ default_clips }}" min="1" max="20">
        </div>
      </div>
      <button type="submit" class="btn" id="go">Proses video</button>
    </form>
    <p class="hint">
      Diproses di background. Video 15 menit biasanya selesai sekitar 4&ndash;5 menit &mdash;
      pantau progresnya di halaman History.
    </p>
    <div id="out"></div>
  </div>
</main>

<script>
const f = document.getElementById('f');
const out = document.getElementById('out');
const go = document.getElementById('go');

f.addEventListener('submit', async (e) => {
  e.preventDefault();
  go.disabled = true;
  go.textContent = 'Mengirim…';
  out.innerHTML = '';
  try {
    const r = await fetch('/jobs', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        url: document.getElementById('url').value,
        target_clips: Number(document.getElementById('n').value)
      })
    });
    const d = await r.json();
    if (!r.ok) {
      // Error validasi FastAPI datang sebagai detail[].msg, bukan string.
      const msg = Array.isArray(d.detail) ? d.detail.map(x => x.msg).join('; ') : (d.detail || 'Gagal');
      out.innerHTML = `<div class="note err">${msg}</div>`;
    } else {
      out.innerHTML = `<div class="note ok">Job dibuat &mdash;
        <a href="/history">lihat progresnya</a></div>`;
      f.reset();
    }
  } catch (err) {
    out.innerHTML = `<div class="note err">${err}</div>`;
  } finally {
    go.disabled = false;
    go.textContent = 'Proses video';
  }
});
</script>
</body>
</html>
