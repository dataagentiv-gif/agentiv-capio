# Postgres + Redis untuk development lokal. API dan worker jalan di host (bukan
# di container): file video sampai ratusan MB, dan bind-mount Docker Desktop di
# Windows terlalu lambat untuk I/O sebesar itu.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper
      POSTGRES_DB: clipper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
