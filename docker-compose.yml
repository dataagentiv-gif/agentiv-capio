# Seluruh sistem dalam satu perintah: docker compose up -d
#
# Ditujukan untuk dijalankan di laptop sendiri, BUKAN di VPS. Groq menolak IP
# datacenter dengan 403 (terbukti di pemakaian), dan yt-dlp kena bot-detection
# YouTube yang jauh lebih galak dari sana. Untuk VPS, ASR harus dipindah ke
# ElevenLabs dan yt-dlp perlu cookies.

x-app: &app
  build: .
  env_file: .env
  environment:
    # Menimpa nilai di .env yang menunjuk localhost. Di dalam jaringan compose,
    # Postgres dan Redis dijangkau lewat nama service, bukan localhost.
    DATABASE_URL: postgresql+psycopg://clipper:clipper@postgres:5432/clipper
    REDIS_URL: redis://redis:6379/0
    WORK_DIR: /work
    CLIPS_DIR: /app/clips
  volumes:
    # Klip mendarat di folder ./clips pada laptop, bukan terkurung di dalam
    # container — bisa dibuka lewat File Explorer, dihapus, atau di-zip.
    - ./clips:/app/clips
    # .env ikut di-mount supaya halaman Setting bisa menulis ke file yang sama
    # dengan yang dibaca saat start, dan isinya bertahan setelah container mati.
    - ./.env:/app/.env
    # Dipasang di KEDUA service, bukan cuma worker. API yang menerima berkas
    # unggahan dan menuliskannya ke /work/unggah; worker yang membacanya saat
    # job jalan. Tanpa volume bersama, keduanya menulis ke /work masing-masing
    # di dalam containernya sendiri — unggahannya tersimpan dengan benar, job
    # dibuat dengan benar, lalu gagal dengan "berkas sudah tidak ada".
    - work:/work
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: clipper
      POSTGRES_DB: clipper
    # Diikat ke loopback. Tanpa awalan 127.0.0.1, Docker mem-publish port ke
    # SEMUA interface — Postgres dengan password bawaan `clipper` jadi terbuka
    # ke seluruh jaringan lokal.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Ini yang paling berbahaya kalau lepas ke jaringan. Redis di sini tanpa
    # password, dan RQ menyimpan nama fungsi sebagai string dotted-path yang
    # di-import worker apa adanya. Siapa pun yang bisa menjangkau Redis dapat
    # mengantre job berisi fungsi apa saja — itu eksekusi kode jarak jauh di
    # mesin worker, bukan sekadar kebocoran data.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  api:
    <<: *app
    environment:
      # Di dalam container WAJIB 0.0.0.0 — mengikat ke 127.0.0.1 membuatnya
      # tidak bisa dijangkau dari luar container sama sekali. Yang membatasi
      # akses adalah baris ports di bawah, yang hanya mem-publish ke loopback
      # laptop.
      API_HOST: 0.0.0.0
      # Dipaku, TIDAK diwarisi dari .env. Port di dalam container adalah detail
      # internal; yang boleh diubah pengguna adalah sisi host di baris ports.
      # Tanpa ini, API_PORT=8080 di .env membuat container mendengar di 8080
      # sementara Docker meneruskan ke 8000 — dan tidak ada yang nyambung.
      API_PORT: 8000
      DATABASE_URL: postgresql+psycopg://clipper:clipper@postgres:5432/clipper
      REDIS_URL: redis://redis:6379/0
      WORK_DIR: /work
      CLIPS_DIR: /app/clips
    # Port di dalam container tetap 8000; yang bisa diubah pengguna adalah sisi
    # host lewat HOST_PORT di .env — bentrokan port itu hal biasa.
    # Awalan 127.0.0.1 membatasi ke laptop sendiri; jangan dihapus tanpa
    # mengisi AUTH_TOKEN lebih dulu.
    ports:
      - "127.0.0.1:${HOST_PORT:-8000}:8000"

  worker:
    <<: *app
    command: ["python", "main.py", "worker"]
    # Volume-nya diwarisi dari anchor di atas. Dulu ditulis ulang di sini, dan
    # daftar yang ditulis ulang MENIMPA daftar induknya — jadi menambah volume
    # di anchor tidak berpengaruh apa-apa untuk service ini. Persis itu yang
    # bikin berkas unggahan tidak terlihat oleh worker.

volumes:
  pgdata:
  redisdata:
  work:
